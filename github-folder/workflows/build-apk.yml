name: Build SAFE APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --project-name safe --org com.example.safe --platforms android .

      - name: Configure manifest (permissions, label, LAN HTTP)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <application android:usesCleartextTraffic="true"|' $M
          sed -i 's|android:label="safe"|android:label="SAFE"|' $M
          grep -n "uses-permission\|label\|cleartext" $M

      - run: flutter pub get
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release --dart-define=SAFE_API_URL=${{ vars.SAFE_API_URL || 'http://10.0.2.2:8000' }}

      - uses: actions/upload-artifact@v4
        with:
          name: SAFE-apk
          path: build/app/outputs/flutter-apk/app-release.apk
